name: Sync Multiple Repos to Gitee

# 触发方式：定时 + 手动 + 推送配置文件变更
on:
  schedule:
    # 每天北京时间 8:00 自动同步（UTC 0:00）
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      repos:
        description: '要同步的仓库（逗号分隔，格式 owner/repo 或 owner/repo=>gitee_name，留空则同步全部）'
        required: false
        default: ''
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/sync-multi-repos.yml'
      - 'repos.txt'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build repo list
        id: list
        run: |
          # 校验 GitHub 端 owner/repo 格式
          validate_github_format() {
            local entry="$1"
            if ! echo "$entry" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'; then
              echo "ERROR: Invalid GitHub repo format: '$entry'"
              echo "  Required format: owner/repo (e.g. your-name/repo-name)"
              echo "  Allowed chars: letters, digits, dot, underscore, hyphen"
              exit 1
            fi
            if [ "$(echo "$entry" | tr -cd '/' | wc -c)" -ne 1 ]; then
              echo "ERROR: '$entry' must contain exactly one '/'"
              exit 1
            fi
          }

          # 校验 Gitee 端仓库名格式
          validate_gitee_name() {
            local name="$1"
            if ! echo "$name" | grep -Eq '^[A-Za-z0-9._-]+$'; then
              echo "ERROR: Invalid Gitee repo name: '$name'"
              echo "  Allowed chars: letters, digits, dot, underscore, hyphen"
              exit 1
            fi
            if [ ${#name} -gt 100 ]; then
              echo "ERROR: Gitee repo name too long (>100): '$name'"
              exit 1
            fi
          }

          # 解析单行：返回 "github_full|gitee_repo"
          parse_entry() {
            local entry="$1"
            local github_full=""
            local gitee_repo=""

            if echo "$entry" | grep -q '=>'; then
              github_full=$(echo "$entry" | sed 's/=>.*//' | xargs)
              gitee_repo=$(echo "$entry" | sed 's/.*=>//' | xargs)
            else
              github_full=$(echo "$entry" | xargs)
              gitee_repo=$(echo "$github_full" | cut -d'/' -f2)
            fi

            validate_github_format "$github_full"
            validate_gitee_name "$gitee_repo"

            echo "${github_full}|${gitee_repo}"
          }

          # 优先使用手动输入的仓库列表
          if [ -n "${{ github.event.inputs.repos }}" ]; then
            IFS=',' read -ra ARR <<< "${{ github.event.inputs.repos }}"
          else
            while IFS= read -r line; do
              line=$(echo "$line" | sed 's/#.*//' | xargs)
              [ -z "$line" ] && continue
              ARR+=("$line")
            done < repos.txt
          fi

          # 解析每一项、检测 Gitee 仓库名重复、构造 JSON 对象数组
          JSON="["
          FIRST=1
          declare -A GITEE_SEEN
          for r in "${ARR[@]}"; do
            r=$(echo "$r" | xargs)
            [ -z "$r" ] && continue
            PARSED=$(parse_entry "$r")
            GITHUB_FULL=$(echo "$PARSED" | cut -d'|' -f1)
            GITEE_REPO=$(echo "$PARSED" | cut -d'|' -f2)

            # 检测 Gitee 仓库名重复（会导致两端互相覆盖）
            if [ -n "${GITEE_SEEN[$GITEE_REPO]+x}" ]; then
              echo "ERROR: Duplicate Gitee repo name detected: '$GITEE_REPO'"
              echo "  Multiple GitHub entries would sync to the same Gitee repository:"
              echo "    - ${GITEE_SEEN[$GITEE_REPO]}  ->  home-assistant-xin/$GITEE_REPO"
              echo "    - $GITHUB_FULL  ->  home-assistant-xin/$GITEE_REPO"
              echo "  Use '=>' to specify a unique Gitee repo name, e.g.:"
              echo "    $GITHUB_FULL => ${GITEE_REPO}-alt"
              exit 1
            fi
            GITEE_SEEN[$GITEE_REPO]="$GITHUB_FULL"

            if [ $FIRST -eq 1 ]; then
              JSON+="{\"github\":\"$GITHUB_FULL\",\"gitee\":\"$GITEE_REPO\"}"
              FIRST=0
            else
              JSON+=",{\"github\":\"$GITHUB_FULL\",\"gitee\":\"$GITEE_REPO\"}"
            fi
          done
          JSON+="]"
          echo "repos=$JSON" >> $GITHUB_OUTPUT
          echo "Will sync: $JSON"

  sync:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.prepare.outputs.repos) }}
    steps:
      - name: Parse owner / repo / gitee_name
        id: parse
        run: |
          GITHUB_FULL="${{ matrix.repo.github }}"
          GITEE_REPO="${{ matrix.repo.gitee }}"
          OWNER=$(echo "$GITHUB_FULL" | cut -d'/' -f1)
          REPO=$(echo "$GITHUB_FULL" | cut -d'/' -f2)
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "gitee_repo=$GITEE_REPO" >> $GITHUB_OUTPUT
          echo "Mapping: GitHub $OWNER/$REPO  ->  Gitee home-assistant-xin/$GITEE_REPO"

      - name: Checkout source repo (GitHub)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.parse.outputs.owner }}/${{ steps.parse.outputs.repo }}
          # 公开仓库使用默认 GITHUB_TOKEN；若清单中包含私有仓库，请配置 GH_PAT
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Mirror to Gitee
        run: |
          git remote add gitee https://${{ secrets.GITEE_USERNAME }}:${{ secrets.GITEE_TOKEN }}@gitee.com/home-assistant-xin/${{ steps.parse.outputs.gitee_repo }}.git
          git push gitee --all --force
          git push gitee --tags --force
          git remote remove gitee

      - name: Report success
        run: echo "Synced ${{ steps.parse.outputs.owner }}/${{ steps.parse.outputs.repo }} -> home-assistant-xin/${{ steps.parse.outputs.gitee_repo }}"
