name: Sync Multiple Repos to Gitee

# 触发方式：定时 + 手动 + 推送配置文件变更
on:
  schedule:
    # 每天北京时间 8:00 自动同步（UTC 0:00）
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      repos:
        description: '要同步的仓库（逗号分隔，格式 owner/repo 或 owner/repo=>gitee_name，留空则同步全部）'
        required: false
        default: ''
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/sync-multi-repos.yml'
      - 'repos.txt'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build repo list
        id: list
        run: |
          python3 << 'PYEOF'
          import json, os, re, sys

          # 读取手动输入或 repos.txt
          manual = "${{ github.event.inputs.repos }}"
          entries = []

          if manual:
              entries = [x.strip() for x in manual.split(',') if x.strip()]
          else:
              with open('repos.txt', 'r', encoding='utf-8') as f:
                  for raw in f:
                      # 去 CRLF、去注释、去空白
                      line = raw.replace('\r', '').replace('\n', '')
                      line = re.sub(r'#.*$', '', line).strip()
                      if line:
                          entries.append(line)

          print(f"::debug::Parsed entries: {entries}")

          # 正则
          GH_RE = re.compile(r'^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$')
          GITEE_RE = re.compile(r'^[A-Za-z0-9._-]+$')

          seen = {}
          result = []

          for entry in entries:
              # 解析映射格式 owner/repo => gitee_name
              if '=>' in entry:
                  left, right = entry.split('=>', 1)
                  github_full = left.strip()
                  gitee_repo = right.strip()
                  if not github_full or not gitee_repo:
                      print(f"::error::Invalid mapping (empty side): '{entry}'")
                      sys.exit(1)
              else:
                  github_full = entry.strip()
                  if '/' not in github_full:
                      print(f"::error::Invalid format (missing '/'): '{entry}'")
                      sys.exit(1)
                  gitee_repo = github_full.split('/', 1)[1]

              # 校验
              if not GH_RE.match(github_full):
                  print(f"::error::Invalid GitHub repo format: '{github_full}'")
                  sys.exit(1)
              if github_full.count('/') != 1:
                  print(f"::error::'{github_full}' must contain exactly one '/'")
                  sys.exit(1)
              if not GITEE_RE.match(gitee_repo):
                  print(f"::error::Invalid Gitee repo name: '{gitee_repo}'")
                  sys.exit(1)
              if len(gitee_repo) > 100:
                  print(f"::error::Gitee repo name too long: '{gitee_repo}'")
                  sys.exit(1)

              # 重复检测
              if gitee_repo in seen:
                  print(f"::error::Duplicate Gitee repo name: '{gitee_repo}'")
                  print(f"  - {seen[gitee_repo]}  ->  home-assistant-xin/{gitee_repo}")
                  print(f"  - {github_full}  ->  home-assistant-xin/{gitee_repo}")
                  sys.exit(1)
              seen[gitee_repo] = github_full

              result.append({"github": github_full, "gitee": gitee_repo})

          if not result:
              print("::error::No repositories to sync. Check repos.txt format.")
              sys.exit(1)

          # 输出 JSON 给 matrix 用
          # 注意 GitHub Actions ::set-output 已废弃，用 $GITHUB_OUTPUT 文件
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"repos={json.dumps(result)}\n")

          print(f"Will sync {len(result)} repos: {json.dumps(result, indent=2)}")
          PYEOF
        env:
          PYTHONIOENCODING: utf-8

  sync:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.prepare.outputs.repos) }}
    steps:
      - name: Parse owner / repo / gitee_name
        id: parse
        run: |
          GITHUB_FULL="${{ matrix.repo.github }}"
          GITEE_REPO="${{ matrix.repo.gitee }}"
          OWNER=$(echo "$GITHUB_FULL" | cut -d'/' -f1)
          REPO=$(echo "$GITHUB_FULL" | cut -d'/' -f2)
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "gitee_repo=$GITEE_REPO" >> $GITHUB_OUTPUT
          echo "Mapping: GitHub $OWNER/$REPO  ->  Gitee home-assistant-xin/$GITEE_REPO"

      - name: Verify Gitee target repo exists
        run: |
          GITEE_REPO="${{ steps.parse.outputs.gitee_repo }}"
          GITEE_USER="${{ secrets.GITEE_USERNAME }}"
          GITEE_TOKEN="${{ secrets.GITEE_TOKEN }}"
          TARGET_URL="https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/home-assistant-xin/${GITEE_REPO}.git"

          echo "Probing Gitee target: home-assistant-xin/${GITEE_REPO}"

          # 用 git ls-remote 探测仓库是否存在（不下载内容，只列引用）
          if git ls-remote --heads "${TARGET_URL}" > /dev/null 2>&1; then
            echo "OK: Gitee target 'home-assistant-xin/${GITEE_REPO}' is accessible."
            exit 0
          fi

          # 探测失败，用 Gitee API 区分原因
          HTTP_CODE=$(curl -s -o /tmp/gitee_resp.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            "https://gitee.com/api/v5/repos/home-assistant-xin/${GITEE_REPO}?access_token=${GITEE_TOKEN}")

          echo "Gitee API HTTP code: $HTTP_CODE"

          if [ "$HTTP_CODE" = "404" ]; then
            echo "::error::Gitee target repo does not exist: home-assistant-xin/${GITEE_REPO}"
            echo "  Please create an empty repository at:"
            echo "  https://gitee.com/projects/new?owner=home-assistant-xin&name=${GITEE_REPO}"
            echo "  (Do NOT initialize with README, otherwise push will be rejected without --force)"
          elif [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "::error::Gitee authentication failed (HTTP $HTTP_CODE)."
            echo "  Check GITEE_USERNAME and GITEE_TOKEN secrets."
            echo "  Token must have 'projects' scope."
            cat /tmp/gitee_resp.json 2>/dev/null || true
          else
            echo "::error::Cannot access Gitee target repo (HTTP $HTTP_CODE)."
            echo "  Response body:"
            cat /tmp/gitee_resp.json 2>/dev/null || true
          fi
          exit 1

      - name: Check if sync is needed (compare GitHub vs Gitee refs)
        id: check_update
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GITEE_USER: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          OWNER="${{ steps.parse.outputs.owner }}"
          REPO="${{ steps.parse.outputs.repo }}"
          GITEE_REPO="${{ steps.parse.outputs.gitee_repo }}"

          GH_URL="https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${REPO}.git"
          GITEE_URL="https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/home-assistant-xin/${GITEE_REPO}.git"

          echo "Fetching refs from GitHub: $OWNER/$REPO..."
          GH_REFS=$(git ls-remote "$GH_URL" 2>&1 | grep -v 'refs/pull/' || true)

          echo "Fetching refs from Gitee: home-assistant-xin/${GITEE_REPO}..."
          GITEE_REFS=$(git ls-remote "$GITEE_URL" 2>&1 | grep -v 'refs/pull/' || true)

          # 对比两端的所有 refs（branches + tags，过滤掉 PR refs）
          if [ "$GH_REFS" = "$GITEE_REFS" ] && [ -n "$GH_REFS" ]; then
            echo "No changes detected. GitHub and Gitee refs are identical."
            echo "skip_sync=true" >> $GITHUB_OUTPUT
          else
            echo "Changes detected (or Gitee is empty). Sync needed."
            if [ -z "$GITEE_REFS" ]; then
              echo "  Reason: Gitee target repo is empty (first sync)."
            else
              echo "  GitHub refs:"
              echo "$GH_REFS" | sed 's/^/    /'
              echo "  Gitee refs:"
              echo "$GITEE_REFS" | sed 's/^/    /'
            fi
            echo "skip_sync=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout sync-gitee-hub (for translate.py)
        uses: actions/checkout@v5

      - name: Install Tencent Cloud SDK
        run: pip install tencentcloud-sdk-python-tmt

      - name: Mirror + Translate to Gitee
        # 不再用 skip_sync 控制：即使 refs 相同，可能 README.md 还没翻译过
        # translate.py 内部会判断是否需要翻译（基于缓存 hash）
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GITEE_USER: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          set -e
          OWNER="${{ steps.parse.outputs.owner }}"
          REPO="${{ steps.parse.outputs.repo }}"
          GITEE_REPO="${{ steps.parse.outputs.gitee_repo }}"

          WORK_DIR="$RUNNER_TEMP/sync-$REPO"
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"

          GH_URL="https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${REPO}.git"
          GITEE_URL="https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/home-assistant-xin/${GITEE_REPO}.git"

          # 1. Clone GitHub 仓库（普通 clone，带 working tree）
          echo "Cloning $OWNER/$REPO..."
          git clone "$GH_URL" "$WORK_DIR/github_repo"
          cd "$WORK_DIR/github_repo"
          git fetch --all --tags

          # 把所有远程分支转为本地分支（用于 push --all）
          for branch in $(git branch -r | grep -v HEAD | sed 's@origin/@@' | tr -d ' '); do
            git branch --track "$branch" "origin/$branch" 2>/dev/null || true
          done

          # 获取默认分支
          DEFAULT_BRANCH=$(git symbolic-ref --short HEAD 2>/dev/null || echo main)
          echo "Default branch: $DEFAULT_BRANCH"

          cd ..

          # 2. Clone Gitee 仓库（拿缓存 .translation-cache.json 和已翻译版本）
          echo "Cloning Gitee repo for cache..."
          if git clone "$GITEE_URL" "$WORK_DIR/gitee_repo" 2>/dev/null; then
            echo "Gitee repo cloned for cache"
          else
            echo "Gitee repo is empty or clone failed (first sync)"
            mkdir -p "$WORK_DIR/gitee_repo"
          fi

          # 3. 检查是否真的需要翻译（基于 README.md hash）
          # 如果 refs 相同且 Gitee 端 README.md 已是中文（hash 在缓存中），跳过整个流程
          README_PATH="$WORK_DIR/github_repo/README.md"
          GITEE_README="$WORK_DIR/gitee_repo/README.md"
          CACHE_FILE="$WORK_DIR/gitee_repo/.translation-cache.json"

          if [ -f "$README_PATH" ] && [ -f "$GITEE_README" ] && [ -f "$CACHE_FILE" ]; then
            README_HASH=$(sha256sum "$README_PATH" | cut -d' ' -f1)
            CACHED_HASH=$(python3 -c "
import json
try:
    with open('$CACHE_FILE') as f:
        c = json.load(f)
        print(c.get('README.md', ''))
except: print('')
")
            if [ "$README_HASH" = "$CACHED_HASH" ]; then
              echo "README.md already translated (hash in cache). Skipping sync."
              echo "skip_final=true" >> $GITHUB_OUTPUT
            else
              echo "README.md needs translation (hash mismatch or not cached)."
            fi
          fi

          # 4. 翻译（translate.py 内部会判断是否需要调用 API）
          echo "Translating README.md..."
          python3 "$GITHUB_WORKSPACE/scripts/translate.py" \
            --source-dir "$WORK_DIR/github_repo" \
            --translated-dir "$WORK_DIR/gitee_repo" \
            --secret-id "$TENCENT_SECRET_ID" \
            --secret-key "$TENCENT_SECRET_KEY"

          # 5. 提交翻译修改（在默认分支上）
          cd "$WORK_DIR/github_repo"
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          git commit -m "Sync from GitHub + translate README.md to Chinese" || echo "No changes to commit (all cached)"

          # 6. Push 到 Gitee
          git remote add gitee "$GITEE_URL"

          echo "Pushing all branches to Gitee..."
          git push gitee --all --force

          echo "Pushing tags to Gitee..."
          git push gitee --tags --force

          # 清理
          git remote remove gitee
          cd "$RUNNER_TEMP"
          rm -rf "$WORK_DIR"

      - name: Report success
        run: echo "Synced ${{ steps.parse.outputs.owner }}/${{ steps.parse.outputs.repo }} -> home-assistant-xin/${{ steps.parse.outputs.gitee_repo }}"
